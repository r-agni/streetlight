[project]
name = "sfcs-sim"
version = "0.1.0"
description = "SF City Sim - vectorized agent simulation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "websockets>=13",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "duckdb>=1.1",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "pyogrio>=0.10",
  "osmnx>=2.0",
  "networkx>=3.3",
  "scipy>=1.14",
  "h3>=4.1",
  "pydantic>=2.9",
  "orjson>=3.10",
  "httpx>=0.27",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "gtfs-realtime-bindings>=1.0",
  "pytest>=8.3",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
